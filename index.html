<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>페어 정리표 만들기</title>
<meta name="description" content="사진과 이름, 키워드를 넣고 예쁜 페어 정리표를 이미지로 저장하세요.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link id="font-google" rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=Gowun+Dodum&family=Jua&family=Nanum+Pen+Script&display=swap">
<link id="font-pretendard" rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard-dynamic-subset.min.css">
<style>
  :root {
    --bg: #ececef; --panel: #ffffff; --ink: #18181b; --muted: #71717a; --faint: #a1a1aa;
    --line: #ececee; --field: #f4f4f5; --focus: #5b5bd6;
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font-family: Pretendard, -apple-system, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
    font-size: 13px; line-height: 1.45;
  }
  button, input { font: inherit; color: inherit; }
  button { cursor: pointer; }
  :focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
  [hidden] { display: none !important; }

  .app { display: grid; grid-template-columns: 360px minmax(0, 1fr); min-height: 100vh; }
  .panel { background: var(--panel); border-right: 1px solid var(--line); height: 100vh; position: sticky; top: 0; display: flex; flex-direction: column; }

  /* 머리 + 탭 */
  .phead { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 14px 16px 10px; }
  .brand { font-size: 15px; font-weight: 700; letter-spacing: -.01em; }
  .save { height: 34px; padding: 0 14px; border: 0; border-radius: 9px; background: var(--ink); color: #fff; font-size: 13px; font-weight: 600; display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; }
  .save svg { width: 14px; height: 14px; }
  .save:hover { background: #2e2e33; }
  .save:disabled { opacity: .6; }
  .tabs { display: flex; gap: 2px; margin: 0 16px; padding: 3px; background: var(--field); border-radius: 10px; }
  .tabs button { flex: 1; height: 30px; border: 0; background: transparent; border-radius: 8px; font-size: 13px; color: var(--muted); }
  .tabs button[aria-selected=true] { background: #fff; color: var(--ink); font-weight: 600; box-shadow: 0 1px 2px rgba(0,0,0,.1); }
  .tabs .n { margin-left: 3px; font-size: 11px; color: var(--faint); font-variant-numeric: tabular-nums; }
  .scroll { overflow-y: auto; flex: 1; padding: 14px 16px 24px; }

  .group { margin-bottom: 20px; }
  .group:last-child { margin-bottom: 0; }
  .group > h2 { display: flex; align-items: baseline; justify-content: space-between; font-size: 12px; font-weight: 600; color: var(--muted); margin: 0 0 8px; }
  .row { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; }
  .row > .lab { width: 58px; flex: none; font-size: 12px; color: var(--muted); }

  input[type=text] { width: 100%; min-width: 0; height: 32px; padding: 0 10px; border: 1px solid transparent; border-radius: 8px; background: var(--field); font-size: 13px; }
  input[type=text]::placeholder { color: var(--faint); }
  input[type=text]:focus { outline: none; border-color: var(--focus); background: #fff; }
  .stack { display: grid; gap: 6px; }
  .duo2 { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }

  .seg { display: flex; flex: 1; background: var(--field); border-radius: 8px; padding: 2px; gap: 2px; }
  .seg button { flex: 1; height: 28px; border: 0; background: transparent; border-radius: 6px; font-size: 12px; color: var(--muted); white-space: nowrap; padding: 0 4px; }
  .seg button[aria-pressed=true] { background: #fff; color: var(--ink); font-weight: 600; box-shadow: 0 1px 2px rgba(0,0,0,.12); }

  /* 테마 타일 */
  .themes { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
  .theme { border: 0; padding: 0; background: none; text-align: center; font-size: 12px; color: var(--muted); }
  .theme i { display: block; height: 38px; border-radius: 8px; margin-bottom: 4px; box-shadow: inset 0 0 0 1px rgba(0,0,0,.08); }
  .theme[aria-pressed=true] { color: var(--ink); font-weight: 600; }
  .theme[aria-pressed=true] i { box-shadow: 0 0 0 2px #fff, 0 0 0 3.5px var(--ink); }

  .swatches { display: flex; gap: 7px; flex-wrap: wrap; }
  .swatches button { width: 26px; height: 26px; border-radius: 50%; border: 1px solid rgba(0,0,0,.12); padding: 0; }
  .swatches button[aria-pressed=true] { box-shadow: 0 0 0 2px #fff, 0 0 0 3.5px var(--ink); }

  .stepper { display: flex; align-items: center; background: var(--field); border-radius: 8px; padding: 2px; }
  .stepper button { width: 28px; height: 28px; border: 0; background: #fff; border-radius: 6px; font-size: 15px; box-shadow: 0 1px 2px rgba(0,0,0,.12); }
  .stepper button:disabled { opacity: .35; cursor: default; box-shadow: none; }
  .stepper output { width: 36px; text-align: center; font-weight: 600; font-size: 12px; }

  .colors { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
  .colors label { display: flex; align-items: center; gap: 6px; min-width: 0; font-size: 12px; color: var(--muted); background: var(--field); border-radius: 8px; padding: 4px 6px 4px 4px; cursor: pointer; white-space: nowrap; overflow: hidden; }
  .colors input[type=color] { width: 22px; height: 22px; flex: none; padding: 0; border: 1px solid rgba(0,0,0,.12); border-radius: 6px; background: none; cursor: pointer; }
  .colors input[type=color]::-webkit-color-swatch-wrapper { padding: 0; }
  .colors input[type=color]::-webkit-color-swatch { border: 0; border-radius: 5px; }
  .colors input[type=color]::-moz-color-swatch { border: 0; border-radius: 5px; }

  .fontbtn { flex: 1; min-width: 0; height: 38px; padding: 0 10px; border: 1px solid transparent; border-radius: 8px; background: var(--field); display: flex; align-items: center; justify-content: space-between; gap: 8px; text-align: left; overflow: hidden; font-size: 13px; }
  .fontbtn:hover { border-color: #d4d4d8; }
  .fontbtn::after { content: "▾"; color: var(--muted); font-size: 10px; flex: none; }
  .fontbtn svg, .fontopt svg { height: 22px; max-width: 100%; display: block; flex: none; }
  .fontbtn svg { flex: 0 1 auto; min-width: 0; }
  .sizes { display: grid; grid-template-columns: 1fr 1fr; gap: 10px 14px; }
  .sizes label { display: grid; grid-template-columns: 1fr auto; font-size: 12px; color: var(--muted); }
  .sizes output { font-variant-numeric: tabular-nums; color: var(--ink); }
  .sizes input[type=range] { grid-column: 1 / -1; width: 100%; margin: 4px 0 0; accent-color: var(--ink); }

  dialog { border: 0; border-radius: 16px; padding: 0; width: min(380px, calc(100vw - 24px)); max-height: min(660px, 86vh); color: var(--ink); background: var(--panel); box-shadow: 0 24px 64px rgba(0,0,0,.28); }
  dialog[open] { display: flex; flex-direction: column; }
  dialog::backdrop { background: rgba(0,0,0,.38); }
  .dlg-head { display: flex; align-items: center; justify-content: space-between; padding: 12px 10px 10px 18px; border-bottom: 1px solid var(--line); }
  .dlg-head h2 { margin: 0; font-size: 14px; font-weight: 700; }
  .dlg-list { overflow-y: auto; padding: 6px 8px 12px; }
  .dlg-list h3 { margin: 12px 10px 4px; font-size: 11px; font-weight: 600; color: var(--muted); }
  .fontopt { width: 100%; min-height: 40px; padding: 7px 10px; border: 0; background: transparent; border-radius: 9px; display: flex; align-items: center; text-align: left; font-size: 13px; }
  .fontopt:hover { background: var(--field); }
  .fontopt[aria-pressed=true] { background: var(--ink); color: #fff; }

  /* 페어 목록 */
  .pairs { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; }
  .pair { display: grid; grid-template-columns: 58px minmax(0, 1fr) 22px; gap: 8px; padding: 8px; border: 1px solid var(--line); border-radius: 12px; transition: border-color .2s, box-shadow .2s; }
  .pair:focus-within { border-color: #d4d4d8; }
  .pair.flash { border-color: var(--focus); box-shadow: 0 0 0 3px rgba(91,91,214,.15); }
  .thumb { width: 58px; height: 58px; border-radius: 9px; border: 1px dashed #c9c9d0; background: var(--field) center / cover no-repeat; color: var(--faint); font-size: 18px; line-height: 1; padding: 0; position: relative; overflow: hidden; }
  .thumb.has { border: 0; color: transparent; }
  .thumb.has:hover::after { content: "바꾸기"; position: absolute; inset: 0; display: grid; place-items: center; background: rgba(0,0,0,.45); color: #fff; font-size: 11px; }
  .fields { display: grid; gap: 4px; min-width: 0; }
  .fields input[type=text] { height: 28px; padding: 0 8px; font-size: 12.5px; border-radius: 7px; }
  .fields input[data-f=pair] { font-weight: 600; }
  .duo { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 4px; }
  .duo .x { font-size: 11px; color: var(--faint); }
  .tools { display: flex; flex-direction: column; gap: 2px; }
  .ib { width: 22px; height: 22px; border: 0; background: transparent; border-radius: 6px; color: var(--faint); font-size: 12px; line-height: 1; padding: 0; }
  .ib:hover:not(:disabled) { background: var(--field); color: var(--ink); }
  .ib.del:hover { color: #c2410c; }
  .ib:disabled { opacity: .3; cursor: default; }
  .adjust { grid-column: 1 / -1; margin-top: -2px; }
  .adjust summary { list-style: none; cursor: pointer; font-size: 11.5px; color: var(--muted); padding: 2px 0; width: max-content; }
  .adjust summary::-webkit-details-marker { display: none; }
  .adjust summary::before { content: "▸ "; font-size: 9px; }
  .adjust[open] summary::before { content: "▾ "; }
  .adjust .sl { display: grid; grid-template-columns: 30px 1fr; align-items: center; gap: 2px 8px; padding: 4px 2px 0; font-size: 11.5px; color: var(--muted); }
  .adjust input[type=range] { width: 100%; min-width: 0; accent-color: var(--ink); margin: 2px 0; }
  .adjust .link { margin-top: 4px; }
  .adds { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; margin-top: 8px; }
  .ghost { height: 34px; border: 1px dashed #d4d4d8; background: #fff; border-radius: 9px; font-size: 12.5px; font-weight: 500; color: var(--muted); }
  .ghost:hover { background: var(--field); color: var(--ink); border-style: solid; }
  .hint { font-size: 11.5px; color: var(--faint); margin: 10px 0 0; }
  .link { border: 0; background: none; padding: 0; color: var(--muted); font-size: 11.5px; text-decoration: underline; text-underline-offset: 2px; }

  .stage { padding: 28px; display: flex; justify-content: center; align-items: flex-start; min-width: 0; }
  canvas { display: block; max-width: 100%; height: auto; border-radius: 6px; box-shadow: 0 2px 6px rgba(0,0,0,.08), 0 18px 48px rgba(0,0,0,.14); }

  @media (max-width: 880px) {
    .app { display: flex; flex-direction: column; }
    /* 휴대폰: 미리보기를 위에 고정해 두고 아래에서 편집, 저장 버튼은 화면 아래 */
    .stage { order: -1; position: sticky; top: 0; z-index: 4; background: var(--bg); padding: 10px; max-height: 42vh; overflow: auto; border-bottom: 1px solid var(--line); }
    .panel { height: auto; position: static; border-right: 0; }
    .phead { padding: 12px 14px 8px; }
    .tabs { margin: 0 14px; }
    .scroll { overflow: visible; padding: 12px 14px 86px; }
    .save { position: fixed; left: 14px; right: 14px; bottom: calc(10px + env(safe-area-inset-bottom)); height: 46px; justify-content: center; font-size: 15px; border-radius: 12px; z-index: 5; box-shadow: 0 6px 20px rgba(0,0,0,.2); }
    input[type=text], .fields input[type=text] { font-size: 16px; height: 36px; }
  }
</style>
</head>
<body>
<div class="app">
  <aside class="panel">
    <div class="phead">
      <div class="brand">페어 정리표</div>
      <button type="button" class="save" id="save"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 2v8M4.5 6.8 8 10.3l3.5-3.5M2.5 13.5h11"/></svg><span>이미지로 저장</span></button>
    </div>
    <div class="tabs" role="tablist" aria-label="편집 메뉴">
      <button type="button" role="tab" id="tab-pairs" aria-controls="pane-pairs" aria-selected="true">페어<span class="n" id="count"></span></button>
      <button type="button" role="tab" id="tab-design" aria-controls="pane-design" aria-selected="false">디자인</button>
      <button type="button" role="tab" id="tab-type" aria-controls="pane-type" aria-selected="false">글자</button>
    </div>
    <div class="scroll" id="scroll">
      <section role="tabpanel" id="pane-pairs" aria-labelledby="tab-pairs">
        <div class="group">
          <h2>머리말</h2>
          <div class="stack">
            <input type="text" id="f-title" aria-label="제목" placeholder="제목">
            <div class="duo2">
              <input type="text" id="f-subtitle" aria-label="부제" placeholder="부제 (선택)">
              <input type="text" id="f-handle" aria-label="아이디" placeholder="@아이디 (선택)">
            </div>
          </div>
        </div>
        <div class="group">
          <h2>페어 <button type="button" class="link" id="clear">전부 비우기</button></h2>
          <ul class="pairs" id="pairs"></ul>
          <div class="adds">
            <button type="button" class="ghost" id="add">+ 페어 추가</button>
            <button type="button" class="ghost" id="add-many">사진 여러 장 넣기</button>
          </div>
          <p class="hint">미리보기의 카드를 누르면 그 페어로 이동해요. PC에서는 사진을 끌어 위치를 맞출 수 있어요. 작업 내용은 이 브라우저에 자동 저장됩니다.</p>
        </div>
      </section>

      <section role="tabpanel" id="pane-design" aria-labelledby="tab-design" hidden>
        <div class="group">
          <h2>테마</h2>
          <div class="themes" id="themes" role="group" aria-label="테마"></div>
        </div>
        <div class="group">
          <h2>색</h2>
          <div class="swatches" id="palettes" role="group" aria-label="색"></div>
        </div>
        <div class="group">
          <h2>배치</h2>
          <div class="row">
            <span class="lab" id="lab-cols">한 줄에</span>
            <div class="stepper" role="group" aria-labelledby="lab-cols">
              <button type="button" id="cols-minus" aria-label="한 줄 개수 줄이기">−</button>
              <output id="cols-out" aria-live="polite"></output>
              <button type="button" id="cols-plus" aria-label="한 줄 개수 늘리기">+</button>
            </div>
          </div>
          <div class="row"><span class="lab">사진 비율</span><div class="seg" id="ratios" role="group" aria-label="사진 비율"></div></div>
          <div class="row"><span class="lab">이름 사이</span><div class="seg" id="seps" role="group" aria-label="캐릭터 이름 사이 기호"></div></div>
          <div class="row" id="row-orn"><span class="lab">제목 장식</span><div class="seg" id="orn" role="group" aria-label="제목 위 장식"></div></div>
        </div>
        <div class="group">
          <h2>색 직접 고르기</h2>
          <div class="colors" id="colors"></div>
        </div>
      </section>

      <section role="tabpanel" id="pane-type" aria-labelledby="tab-type" hidden>
        <div class="group">
          <h2>글꼴</h2>
          <div class="row"><span class="lab" id="lab-font-title">제목</span><button type="button" class="fontbtn" id="font-title" aria-haspopup="dialog" aria-labelledby="lab-font-title font-title"></button></div>
          <div class="row"><span class="lab" id="lab-font-name">페어 이름</span><button type="button" class="fontbtn" id="font-name" aria-haspopup="dialog" aria-labelledby="lab-font-name font-name"></button></div>
          <div class="row"><span class="lab" id="lab-font-body">그 외</span><button type="button" class="fontbtn" id="font-body" aria-haspopup="dialog" aria-labelledby="lab-font-body font-body"></button></div>
        </div>
        <div class="group">
          <h2>글자 크기</h2>
          <div class="sizes">
            <label>제목 <output id="size-title-out"></output><input type="range" id="size-title" min=".5" max="2" step=".05"></label>
            <label>페어 이름 <output id="size-name-out"></output><input type="range" id="size-name" min=".5" max="2" step=".05"></label>
            <label>캐릭터 <output id="size-chars-out"></output><input type="range" id="size-chars" min=".5" max="2" step=".05"></label>
            <label>키워드 <output id="size-tag-out"></output><input type="range" id="size-tag" min=".5" max="2" step=".05"></label>
          </div>
        </div>
        <div class="group"><button type="button" class="link" id="reset-style">색·글꼴·크기 기본값으로 되돌리기</button></div>
      </section>
    </div>
  </aside>

  <main class="stage"><canvas id="cv" role="img" aria-label="페어 정리표 미리보기"></canvas></main>
</div>
<dialog id="fontdlg" aria-labelledby="fontdlg-title">
  <div class="dlg-head"><h2 id="fontdlg-title">글꼴 고르기</h2><button type="button" class="mini" id="fontdlg-close">닫기</button></div>
  <div class="dlg-list" id="fontlist"></div>
</dialog>
<input type="file" id="file-one" accept="image/*" hidden>
<input type="file" id="file-many" accept="image/*" multiple hidden>

<script>
/* =====================================================================
   페어 정리표 만들기
   - 화면에 보이는 미리보기(canvas)가 그대로 저장되는 이미지입니다.
   - 처음 열었을 때의 기본값을 바꾸고 싶으면 아래 DEFAULTS 만 고치세요.
   ===================================================================== */
const DEFAULTS = {
  title: "나의 페어 정리표",
  subtitle: "",
  handle: "",
  theme: "minimal",        // minimal | gallery | soda | polaroid | night | xmas
  cols: 3,                 // 한 줄에 들어가는 개수 (1~8)
  ratio: "1:1",            // 1:1 | 3:4 | 4:3
  sep: "×",
};
const SAMPLE_PAIRS = [
  ["달과 별", "루나", "스텔라", "소꿉친구, 쌍방구원"],
  ["파도 소리", "마린", "노아", "재회, 여름"],
  ["검과 방패", "아스터", "린", "라이벌, 애증"],
  ["새벽 세 시", "이든", "하루", "룸메이트, 일상"],
  ["첫눈", "설", "겨울", "첫사랑"],
  ["온실", "아이리스", "로완", "사제, 성장"],
];

/* ---------- 공통 도구 ---------- */
const CW = 300;                               // 카드 한 장의 기준 폭
const RATIOS = { "1:1": 1, "3:4": 3 / 4, "4:3": 4 / 3 };
const SEPS = ["×", "♥", "&", "·", "/"];
const SERIF = '"Gowun Batang","Noto Serif KR","AppleMyungjo",serif';
const SANS = 'Pretendard,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif';
const DODUM = '"Gowun Dodum",' + SANS;
const PEN = '"Nanum Pen Script","Gowun Dodum",cursive';
const JUA = 'Jua,' + SANS;
const f = (w, s, fam) => `${w} ${s}px ${fam}`;

const $ = (id) => document.getElementById(id);
const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
const uid = () => Math.random().toString(36).slice(2, 10);
function hexRgb(h) { const n = parseInt(h.slice(1), 16); return [n >> 16, (n >> 8) & 255, n & 255]; }
function mix(a, b, t) { const A = hexRgb(a), B = hexRgb(b); return "rgb(" + A.map((v, i) => Math.round(v + (B[i] - v) * t)).join(",") + ")"; }
function alpha(h, a) { return "rgba(" + hexRgb(h).join(",") + "," + a + ")"; }
function rng(seed) { return () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
function hash(s) { let h = 2166136261; for (let i = 0; i < s.length; i++) h = Math.imul(h ^ s.charCodeAt(i), 16777619); return h >>> 0; }

let S = 2; // 현재 그리는 배율 (그림자는 배율을 직접 곱해줘야 함)
function shadow(ctx, color, blur, oy) { ctx.shadowColor = color; ctx.shadowBlur = blur * S; ctx.shadowOffsetX = 0; ctx.shadowOffsetY = oy * S; }
function noShadow(ctx) { ctx.shadowColor = "transparent"; ctx.shadowBlur = 0; ctx.shadowOffsetY = 0; }
function rrect(ctx, x, y, w, h, r) {
  const [tl, tr, br, bl] = (Array.isArray(r) ? r : [r, r, r, r]).map((v) => Math.min(v, w / 2, h));
  ctx.beginPath();

const requested = new Set();
function face(spec, role) {           // 역할(title | name | body)에 지정한 글꼴이 있으면 그것, 없으면 테마 기본
  const def = FONTS.find((x) => x.id === state.font[role]) || FONTS.find((x) => x.id === spec.fam);
  const w = def.w.reduce((a, b) => (Math.abs(b - spec.w) < Math.abs(a - spec.w) ? b : a));
  if (!def.pre && !requested.has(def.id)) {   // 처음 쓰는 글꼴은 그때 불러옴
    requested.add(def.id);
    const again = () => { fontKey = ""; draw(); };
    if (def.src) {
      for (const [weight, path] of Object.entries(def.src)) {
        try { const ff = new FontFace(def.id, `url("${NOONNU}${path}")`, { weight }); document.fonts.add(ff); ff.load().then(again, () => {}); } catch (e) {}
      }
    } else {
      const l = document.createElement("link"); l.rel = "stylesheet";
      l.href = "https://fonts.googleapis.com/css2?family=" + def.id.replace(/ /g, "+") + (def.w.length > 1 ? ":wght@" + def.w.join(";") : "") + "&display=swap";
      l.onload = again; document.head.append(l);
    }
  }
  return { fam: def.id, w };
}

const solid = (c) => `linear-gradient(${c},${c})`;
const TILES = {
  minimal: (p) => `${solid(mix(p.bg, p.ink, .14))} 30% 42%/22% 46% no-repeat, ${solid(mix(p.bg, p.ink, .14))} 70% 42%/22% 46% no-repeat, ${p.bg}`,

// 테마 버튼 순서: 담백한 것 → 화려한 것
const THEME_ORDER = ["minimal", "gallery", "soda", "polaroid", "night", "xmas"];

/* ---------- 상태 ---------- */
let state = null;
const images = new Map();   // pair.id -> HTMLImageElement
function freshState() {
  return {
    ...DEFAULTS, pal: {}, colors: {}, font: { title: "", name: "", body: "" }, size: { title: 1, name: 1, chars: 1, tag: 1 },
    pairs: SAMPLE_PAIRS.map(([pair, c1, c2, kw]) => ({ id: uid(), img: null, fx: .5, fy: .5, zoom: 1, pair, c1, c2, kw })),
  };
}

/* ---------- 레이아웃 ---------- */
const cv = $("cv"), ctx = cv.getContext("2d");
let hits = [];              // 미리보기에서 카드를 눌렀을 때 찾기 위한 위치 정보
let logicalW = 1;

function layoutCard(T, st, pr, ratio) {
  const c = T.card, pw = CW - c.inset * 2, ph = pw / ratio, tw = CW - c.tin * 2;
  const items = []; let y = 0;
  ctx.font = st.name.font;
  for (const t of wrap(ctx, pr.pair, tw)) { items.push({ k: "name", t, y: y + st.name.lh / 2 }); y += st.name.lh; }

  const c1 = (pr.c1 || "").trim(), c2 = (pr.c2 || "").trim();
  if (c1 || c2) {
    if (y) y += st.chars.gap;
    ctx.font = st.chars.font;
    const sep = { t: " " + state.sep + " ", sep: true };
    let lines = c1 && c2 ? [[{ t: c1 }, sep, { t: c2 }]] : [[{ t: c1 || c2 }]];
    const width = (segs) => segs.reduce((s, g) => s + ctx.measureText(g.t).width, 0);
    if (c1 && c2 && width(lines[0]) > tw) lines = [[{ t: c1 }, { t: " " + state.sep, sep: true }], [{ t: c2 }]];
    for (const segs of lines) {
      const w = width(segs);
      items.push({ k: "chars", segs, w, scale: Math.min(1, tw / w), y: y + st.chars.lh / 2 }); y += st.chars.lh;
    }
  }

  const tags = tagsOf(pr.kw);
  if (tags.length) {
    if (y) y += st.tag.gap;
    ctx.font = st.tag.font;
    const chip = st.tag.kind === "chip", px = chip ? st.tag.px : 0;
    let row = [], rw = 0; const rows = [];
    for (const tg of tags) {
      let t = chip ? tg : "#" + tg;
      while (t.length > 2 && ctx.measureText(t).width + px * 2 > tw) t = t.slice(0, -2) + "…";
      const w = ctx.measureText(t).width + px * 2;
      if (row.length && rw + st.tag.sp + w > tw) { rows.push({ row, rw }); row = []; rw = 0; }
      rw += (row.length ? st.tag.sp : 0) + w; row.push({ t, w });
    }
    if (row.length) rows.push({ row, rw });
    rows.forEach((r, i) => {
      if (i) y += chip ? st.tag.rowGap : 0;
      items.push({ k: "tags", ...r, y: y + st.tag.lh / 2 }); y += st.tag.lh;
    });
  }
  const textTop = c.top + ph + c.frameB + c.gapT;
  const h = items.length ? textTop + y + c.padB : c.top + ph + c.frameB + c.emptyB;
  return { photo: { x: c.inset, y: c.top, w: pw, h: ph }, items, textTop, h };
}

function photoGeom(img, r, pr) {
  const s = Math.max(r.w / img.naturalWidth, r.h / img.naturalHeight) * (pr.zoom || 1);
  const dw = img.naturalWidth * s, dh = img.naturalHeight * s;
  return { dw, dh, dx: r.x - (dw - r.w) * pr.fx, dy: r.y - (dh - r.h) * pr.fy };
}

function drawCard(T, st, p, col, L, h, pr, i) {
  const c = T.card, r = L.photo;
  T.frame(ctx, h, r, p, () => {
    const img = images.get(pr.id);
    if (img && img.complete && img.naturalWidth) {
      const g = photoGeom(img, r, pr); ctx.drawImage(img, g.dx, g.dy, g.dw, g.dh);

function render() {

  const n = state.pairs.length, cols = clamp(Math.min(state.cols, n || 1), 1, 8), ratio = RATIOS[state.ratio] || 1;
  const W = T.pad.x * 2 + cols * CW + (cols - 1) * T.gap.x, innerW = W - T.pad.x * 2;
  const k = cols >= 3 ? 1 : cols === 2 ? .84 : .62;

  const rows = [];

    rows.push({ idx, h: Math.max(...idx.map((j) => Ls[j].h)) });
  }
  const gridH = rows.reduce((s, r) => s + r.h, 0) + Math.max(0, rows.length - 1) * T.gap.y;
  const handle = (state.handle || "").trim().replace(/^@?/, "@").replace(/^@$/, "");
  const footH = handle ? 40 + 20 : 0;

  // 여백 맞추기(balance 테마): 눈에 보이는 글자/사진 끝을 기준으로 위·아래 여백을 좌우 여백과 똑같이

    if (handle) inkBottom = gridEnd + 50 + inkDesc(fnt(T.hand, "body", T.hand.size), handle);
    else for (const j of last.idx) {
      const L = Ls[j], it = L.items[L.items.length - 1];

      const font = it.k === "name" ? st.name.font : it.k === "chars" ? st.chars.font : st.tag.font;
      const text = it.k === "name" ? it.t : it.k === "chars" ? it.segs.map((g) => g.t).join("") : it.row.map((g) => g.t).join(" ");

    row.idx.forEach((j, c) => {
      const pr = state.pairs[j], L = Ls[j], x = x0 + c * (CW + T.gap.x), h = T.equalH ? row.h : L.h;

  let y = top0;
  if (hasHead) {
    const center = T.align === "center", ax = center ? W / 2 : T.pad.x;
    if (orn) y += T.ornament(ctx, W, y, p);
    ctx.textAlign = center ? "center" : "left"; ctx.textBaseline = "middle";
    ctx.font = fnt(T.title, "title", ts); ctx.fillStyle = T.title.color(p);
    for (const t of tl) { ctx.fillText(t, ax, y + ts * T.title.lh / 2); y += ts * T.title.lh; }
    if (sl.length) {
      if (tl.length) y += T.sub.gap;
      ctx.font = fnt(T.sub, "body", ss); ctx.fillStyle = T.sub.color(p);
      for (const t of sl) { ctx.fillText(t, ax, y + ss * 1.55 / 2); y += ss * 1.55; }

  for (const c of placed) {
    const pr = state.pairs[c.j], rot = T.rotate ? T.rotate(c.j, pr.id) : 0;
    ctx.save();
    ctx.translate(c.x + CW / 2, c.y + c.h / 2); ctx.rotate(rot); ctx.translate(-CW / 2, -c.h / 2);

  }
  if (!n) {
    ctx.font = f(500, 14, SANS); ctx.fillStyle = T.title.color(p); ctx.globalAlpha = .5; ctx.textAlign = "center";
    ctx.fillText("페어를 추가해 주세요", W / 2, top0 + headH + 60); ctx.globalAlpha = 1;

  if (handle) { ctx.textBaseline = "middle"; ctx.font = fnt(T.hand, "body", T.hand.size); T.handle(ctx, W, top0 + headH + (n ? gridH : 120) + 50, p, handle); }
}

/* 글꼴이 준비되기 전에 그리면 기본 글꼴로 나오므로, 필요한 글자를 불러온 뒤 다시 그림 */
let fontKey = "";
function ensureFonts() {

  const T = THEMES[state.theme], c = T.card;
  const faces = [[T.title, "title"], [T.sub, "body"], [c.name, "name"], [c.chars, "body"], [c.tag, "body"], [T.hand, "body"]].map(([sp, role]) => { const x = face(sp, role); return `${x.w} 20px "${x.fam}"`; });

/* ---------- 저장 (브라우저 안에만 보관) ---------- */
const store = {

  async get(k) { const db = await this.open(); return new Promise((res, rej) => { const q = db.transaction("kv").objectStore("kv").get(k); q.onsuccess = () => res(q.result); q.onerror = () => rej(q.error); }); },
  async set(k, v) { const db = await this.open(); return new Promise((res, rej) => { const t = db.transaction("kv", "readwrite"); t.objectStore("kv").put(v, k); t.oncomplete = res; t.onerror = () => rej(t.error); }); },
};

/* ---------- 사진 ---------- */
function loadImage(pr) {
  if (!pr.img) { images.delete(pr.id); return; }
  const im = new Image(); im.onload = draw; im.src = pr.img; images.set(pr.id, im);
}
function fileToDataURL(file) {   // 큰 사진은 줄여서 보관 (투명 배경은 유지)
  return new Promise((res, rej) => {
    const url = URL.createObjectURL(file), im = new Image();
    im.onload = () => {
      const s = Math.min(1, 1400 / Math.max(im.naturalWidth, im.naturalHeight));
      const c = document.createElement("canvas"); c.width = Math.round(im.naturalWidth * s); c.height = Math.round(im.naturalHeight * s);
      c.getContext("2d").drawImage(im, 0, 0, c.width, c.height); URL.revokeObjectURL(url);
      res(c.toDataURL("image/webp", .92));

}

  });
  ul.addEventListener("click", (e) => {
    const b = e.target.closest("[data-act]"); if (!b) return;
    const pr = pairOf(b), i = state.pairs.indexOf(pr), act = b.dataset.act;
    if (act === "photo") return pickPhoto(pr);
    if (act === "up" && i > 0) state.pairs.splice(i - 1, 0, state.pairs.splice(i, 1)[0]);
    if (act === "down" && i < state.pairs.length - 1) state.pairs.splice(i + 1, 0, state.pairs.splice(i, 1)[0]);
    if (act === "nophoto") { pr.img = null; images.delete(pr.id); }
    if (act === "del") { state.pairs.splice(i, 1); images.delete(pr.id); }
    renderList(); draw();
  });
  $("add").onclick = () => {
    const pr = { id: uid(), img: null, fx: .5, fy: .5, zoom: 1, pair: "", c1: "", c2: "", kw: "" };
    state.pairs.push(pr); renderList(); draw(); focusPair(pr.id);
  };
  $("add-many").onclick = () => { $("file-many").value = ""; $("file-many").click(); };
  $("file-one").onchange = async (e) => {
    const pr = state.pairs.find((p) => p.id === photoTarget), file = e.target.files[0];
    if (pr && file && await setPhoto(pr, file)) { renderList(); draw(); }
  };
  $("file-many").onchange = async (e) => {
    for (const file of e.target.files) {
      const pr = { id: uid(), img: null, fx: .5, fy: .5, zoom: 1, pair: "", c1: "", c2: "", kw: "" };
      if (await setPhoto(pr, file)) state.pairs.push(pr);
    }
    renderList(); draw();
  };
  $("clear").onclick = () => {
    if (!confirm("페어를 전부 지울까요? 되돌릴 수 없어요.")) return;
    state.pairs = []; images.clear(); renderList(); draw();
  };
  $("save").onclick = saveImage;
  for (const t of ["pairs", "design", "type"]) $("tab-" + t).onclick = () => setTab(t);

  // 미리보기: 카드를 누르면 해당 페어로 이동, 마우스로 사진을 끌면 위치 조정
  const at = (e) => { const r = cv.getBoundingClientRect(), k = logicalW / r.width; return { x: (e.clientX - r.left) * k, y: (e.clientY - r.top) * k, k }; };
  const inside = (pt, r) => pt.x >= r.x && pt.x <= r.x + r.w && pt.y >= r.y && pt.y <= r.y + r.h;
  let drag = null;
  cv.addEventListener("pointerdown", (e) => {
    const pt = at(e), hit = hits.find((h) => inside(pt, h)); if (!hit) return;
    const pr = state.pairs.find((p) => p.id === hit.id), img = images.get(hit.id), onPhoto = inside(pt, hit.photo);
    drag = { hit, pr, onPhoto, sx: e.clientX, sy: e.clientY, fx: pr.fx, fy: pr.fy, moved: false, can: onPhoto && img && e.pointerType !== "touch" };
    if (drag.can) cv.setPointerCapture(e.pointerId);
  });
  cv.addEventListener("pointermove", (e) => {
    const pt = at(e);
    if (!drag) {
      const hit = hits.find((h) => inside(pt, h));
      cv.style.cursor = !hit ? "default" : inside(pt, hit.photo) && images.get(hit.id) ? "grab" : "pointer"; return;
    }
    const dx = (e.clientX - drag.sx) * pt.k, dy = (e.clientY - drag.sy) * pt.k;
    if (Math.hypot(dx, dy) > 4) drag.moved = true;
    if (!drag.can || !drag.moved) return;
    cv.style.cursor = "grabbing";
    const g = photoGeom(images.get(drag.pr.id), drag.hit.photo, drag.pr);
    const rx = g.dw - drag.hit.photo.w, ry = g.dh - drag.hit.photo.h;
    if (rx > .5) drag.pr.fx = clamp(drag.fx - dx / rx, 0, 1);
    if (ry > .5) drag.pr.fy = clamp(drag.fy - dy / ry, 0, 1);
    draw();
  });
  const end = () => {
    if (!drag) return; const d = drag; drag = null; cv.style.cursor = "default";
    if (d.moved) { if (d.can) renderList(); return; }
    if (d.onPhoto && !d.pr.img) pickPhoto(d.pr); else focusPair(d.pr.id);
  };
  cv.addEventListener("pointerup", end);
  cv.addEventListener("pointercancel", () => { drag = null; });
}
function focusPair(id) {
  if ($("pane-pairs").hidden) setTab("pairs");
  const li = document.querySelector(`.pair[data-id="${id}"]`); if (!li) return;
  li.scrollIntoView({ block: "center", behavior: "smooth" });
  li.classList.add("flash"); setTimeout(() => li.classList.remove("flash"), 1200);
  const inp = li.querySelector('input[data-f="pair"]'); if (inp) inp.focus({ preventScroll: true });
}

async function saveImage() {
  const btn = $("save"), lab = btn.querySelector("span"); btn.disabled = true; lab.textContent = "만드는 중…";
  try {
    await ensureFonts(); render();
    const blob = await new Promise((res) => cv.toBlob(res, "image/png"));
    if (!blob) throw new Error("blob");
    const name = "pair-table.png";
    const file = new File([blob], name, { type: "image/png" });
    // 휴대폰에서는 공유 창을 열어 사진 앱에 바로 저장할 수 있게 함
    if (matchMedia("(pointer: coarse)").matches && navigator.canShare && navigator.canShare({ files: [file] })) {
      try { await navigator.share({ files: [file] }); return; } catch (e) { if (e.name === "AbortError") return; }
    }
    const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = name;
    document.body.append(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 5000);
  } catch (e) {
    alert("이미지를 만들지 못했어요. 페어 수를 줄이거나 다른 브라우저에서 다시 시도해 주세요.");
  } finally { btn.disabled = false; lab.textContent = "이미지로 저장"; }
}

/* ---------- 시작 ---------- */
(async function init() {
  let saved = null;
  try { saved = await store.get("state"); } catch (e) {}
  state = saved && Array.isArray(saved.pairs) ? { ...freshState(), ...saved } : freshState();
  if (!THEMES[state.theme]) state.theme = DEFAULTS.theme;
  state.cols = clamp(parseInt(state.cols, 10) || DEFAULTS.cols, 1, 8);
  state.pal = state.pal || {}; state.colors = state.colors || {};
  state.font = { title: "", name: "", body: "", ...(state.font || {}) };
  state.size = { title: 1, name: 1, chars: 1, tag: 1, ...(state.size || {}) };
  state.pairs.forEach(loadImage);
  bind(); syncControls(); renderList(); draw();
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => render());
})();
</script>
